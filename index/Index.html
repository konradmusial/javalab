<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
</head>
<body>
    <div id="inputContainer"></div>

    <div id="result">
        <p>Suma: <span id="sumElement">-</span></p>
        <p>Średnia: <span id="average">-</span></p>
        <p>Min: <span id="minValue">-</span></p>
        <p>Max: <span id="maxValue">-</span></p>
    </div>

    <div id="buttons">
        <button id="addInput">Dodaj pole</button>
        <button id="removeLast">Usuń ostatnie</button>
    </div>

    <script>
        const container = document.querySelector("#inputContainer");
        const addBtn = document.querySelector("#addInput");
        const removeBtn = document.querySelector("#removeLast");

        const sumElement = document.querySelector("#sumElement");
        const averageElement = document.querySelector("#average");
        const minElement = document.querySelector("#minValue");
        const maxElement = document.querySelector("#maxValue");

        const createInputField = () => {
            const input = document.createElement("input");
            input.type = "number";
            input.classList.add("Number");
            input.placeholder = "Wstaw cyfrę";
            input.addEventListener("input", calculateLive);
            container.appendChild(input);
        };

        for (let i = 0; i < 3; i++) createInputField();

        addBtn.addEventListener("click", createInputField);

        removeBtn.addEventListener("click", () => {
            const inputs = document.querySelectorAll(".Number");
            if (inputs.length > 0) {
                container.removeChild(inputs[inputs.length - 1]);
            }
            calculateLive(); 
        });

        function calculateLive() {
            const values = [...document.querySelectorAll(".Number")]
                .map(input => parseInt(input.value))
                .filter(value => !isNaN(value));

            if (values.length === 0) {
                sumElement.textContent = averageElement.textContent =
                minElement.textContent = maxElement.textContent = "-";
                return;
            }

            const sum = values.reduce((acc, val) => acc + val, 0);
            const avg = sum / values.length;
            const min = Math.min(...values);
            const max = Math.max(...values);

            sumElement.textContent = sum;
            averageElement.textContent = avg.toFixed(2);
            minElement.textContent = min;
            maxElement.textContent = max;
        }
    </script>
</body>
</html>
